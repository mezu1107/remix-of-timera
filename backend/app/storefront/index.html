<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timera — Watches & Perfumes</title>
<meta name="description" content="Timera watches and perfumes. Cash on delivery across Pakistan.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0b;--card:#181613;--line:#2b2823;--fg:#f3ede2;--mut:#a39a8a;--gold:#c9a45c;--red:#d9534f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Karla,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:.2em 0}
.wrap{max-width:1200px;margin:auto;padding:0 16px}
.bar{background:var(--gold);color:#111;overflow:hidden;white-space:nowrap;font-size:13px;padding:6px 0}
.bar span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
header{position:sticky;top:0;background:rgba(14,13,11,.95);border-bottom:1px solid var(--line);z-index:10}
header .wrap{display:flex;align-items:center;gap:20px;height:62px}
.logo{font-family:'Cormorant Garamond';font-size:26px;letter-spacing:4px;color:var(--gold)}
nav{display:flex;gap:18px;flex:1;font-size:14px}nav a:hover{color:var(--gold)}
.btn{background:var(--gold);color:#111;border:0;padding:12px 22px;font-weight:600;cursor:pointer;border-radius:2px;display:inline-block}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.hero{min-height:70vh;display:flex;align-items:center;background-size:cover;background-position:center;position:relative}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.1))}
.hero .wrap{position:relative}.hero h1{font-size:clamp(36px,6vw,72px);max-width:640px}.acc{color:var(--gold)}
section{padding:48px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);display:block}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#222}
.card .b{padding:12px}.price{color:var(--gold);font-weight:600}.old{color:var(--mut);text-decoration:line-through;font-size:13px;margin-left:6px}
.badge{position:absolute;margin:8px;background:var(--red);color:#fff;font-size:11px;padding:3px 8px}
.deal{background:linear-gradient(120deg,#2a2112,#141210);border:1px solid var(--gold);padding:28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.code{border:1px dashed var(--gold);padding:6px 12px;color:var(--gold);font-weight:600}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:11px;margin:5px 0 12px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}@media(max-width:760px){.two{grid-template-columns:1fr}nav{display:none}nav.open{display:flex;flex-direction:column;position:absolute;top:62px;left:0;right:0;background:var(--bg);padding:16px}}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tabs a{margin-right:14px;padding-bottom:4px}.tabs a.on{color:var(--gold);border-bottom:2px solid var(--gold)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px;margin-top:40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:12px 20px;display:none;z-index:50}
.wa{position:fixed;right:16px;bottom:16px;background:#25d366;color:#fff;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:26px;z-index:20}
.menu{display:none;background:none;border:0;color:var(--fg);font-size:24px}@media(max-width:760px){.menu{display:block}}
.thumbs img{width:64px;height:64px;object-fit:cover;margin:6px 6px 0 0;cursor:pointer;border:1px solid var(--line)}
.err{color:var(--red)}.mut{color:var(--mut)}
</style>
</head>
<body>
<div class="bar"><span id="bar">Free delivery on orders above Rs 5,000 · Cash on delivery all over Pakistan · 1–2 year warranty</span></div>
<header><div class="wrap">
  <button class="menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
  <a href="#/" class="logo" id="logo">TIMERA</a>
  <nav onclick="this.classList.remove('open')"><a href="#/">Home</a><a href="#/shop?type=watch">Watches</a><a href="#/shop?type=perfume">Perfumes</a><a href="#/shop">Shop All</a><a href="#/track">Track Order</a><a href="#/account">Account</a></nav>
  <a href="#/cart" class="btn o">Cart (<span id="cc">0</span>)</a>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><b class="logo" style="font-size:18px">TIMERA</b> · Founded 2025 · Watches & Perfumes · Pakistan<br><span id="foot"></span></div></footer>
<a class="wa" id="wa" href="#" style="display:none" target="_blank">✆</a>
<div class="toast" id="toast"></div>
<script>
const API="/api/v1",$=s=>document.querySelector(s),app=$("#app");
const rs=n=>"Rs "+Number(n||0).toLocaleString("en-PK",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=async p=>{const r=await fetch(API+p,{headers:auth()});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||"Error");return j};
const post=async(p,b,m="POST")=>{const r=await fetch(API+p,{method:m,headers:{"Content-Type":"application/json",...auth()},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail=="string"?j.detail:"Please check the form");return j};
const auth=()=>localStorage.tok?{Authorization:"Bearer "+localStorage.tok}:{};
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)};
const sid=localStorage.sid||(localStorage.sid=crypto.randomUUID());
let cart=JSON.parse(localStorage.cart||"[]"),S={settings:{},payment:{}};
const saveCart=()=>{localStorage.cart=JSON.stringify(cart);$("#cc").textContent=cart.reduce((a,i)=>a+i.quantity,0)};
const track=(event_name,props={})=>fetch(API+"/track/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_name,session_id:sid,path:location.hash,properties:props})}).catch(()=>{});
const price=p=>Number(p.sale_price||p.price);
const card=p=>`<a class="card" href="#/p/${esc(p.slug)}">${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}<img loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.name)}"><div class="b"><div>${esc(p.name)}</div><span class="price">${rs(price(p))}</span>${p.sale_price&&Number(p.sale_price)<Number(p.price)?`<span class="old">${rs(p.price)}</span>`:""}</div></a>`;

async function home(){
  const [h,d,f,all]=await Promise.all([get("/hero-slides"),get("/deals"),get("/products?featured=true"),get("/products")]);
  const s=h.slides[0]||{title:"Timeless by design",title_accent:"Timera",description:"Watches & perfumes crafted for everyday luxury.",cta_label:"Shop now",cta_href:"#/shop"};
  const href=x=>!x?"#/shop":x.startsWith("#")?x:"#"+x;
  app.innerHTML=`<div class="hero" style="background-image:url('${esc(s.image_url||"")}')"><div class="wrap"><div class="acc">${esc(s.eyebrow||"")}</div><h1>${esc(s.title)} <span class="acc">${esc(s.title_accent||"")}</span></h1><p class="mut" style="max-width:520px">${esc(s.description||"")}</p><a class="btn" href="${esc(href(s.cta_href))}">${esc(s.cta_label||"Shop now")}</a></div></div>
  ${d.deals.length?`<section><div class="wrap">${d.deals.map(x=>`<div class="deal"><div><div class="acc">${esc(x.badge||"DEAL")}</div><h2>${esc(x.title)}</h2><p>${esc(x.subtitle||"")}</p><p class="mut">${esc(x.description||"")}</p></div><div style="text-align:center">${x.code?`<div class="code">CODE: ${esc(x.code)}</div><br>`:""}<a class="btn" href="${esc(href(x.cta_href))}">${esc(x.cta_label||"Shop the deal")}</a></div></div>`).join("")}</div></section>`:""}
  <section><div class="wrap"><h2>Bestsellers</h2><div class="grid">${(f.products.length?f.products:all.products).slice(0,8).map(card).join("")}</div></div></section>
  <section><div class="wrap"><h2>New Arrivals</h2><div class="grid">${all.products.slice(0,12).map(card).join("")}</div><p style="text-align:center"><a class="btn o" href="#/shop">View all</a></p></div></section>`;
}
async function shop(q){
  const type=q.get("type")||"",search=q.get("q")||"";
  const r=await get("/products?"+new URLSearchParams({...(type&&{type}),...(search&&{q:search})}));
  if(search)track("search",{q:search});
  app.innerHTML=`<section><div class="wrap"><h1>${type=="perfume"?"Perfumes":type=="watch"?"Watches":"Shop All"}</h1>
  <div class="tabs"><a class="${!type?"on":""}" href="#/shop">All</a><a class="${type=="watch"?"on":""}" href="#/shop?type=watch">Watches</a><a class="${type=="perfume"?"on":""}" href="#/shop?type=perfume">Perfumes</a></div>
  <form onsubmit="event.preventDefault();location.hash='#/shop?'+new URLSearchParams({${type?`type:'${type}',`:""}q:this.q.value})" style="max-width:400px;margin-top:16px"><input name="q" placeholder="Search…" value="${esc(search)}"></form>
  <div class="grid">${r.products.map(card).join("")||"<p class='mut'>No products found.</p>"}</div></div></section>`;
}
async function product(slug){
  let r;try{r=await get("/products/"+encodeURIComponent(slug))}catch{app.innerHTML=`<section><div class="wrap"><h1>Product not found</h1><a class="btn" href="#/shop">Back to shop</a></div></section>`;return}
  const p=r.product,imgs=[p.image_url,...(p.gallery||[])].filter(x=>typeof x=="string"&&x);
  const colors=(p.colors||[]).map(c=>typeof c=="string"?c:c.name).filter(Boolean);
  const perf=p.product_type=="perfume";
  const spec=perf?[["Fragrance family",p.fragrance_family],["Concentration",p.concentration],["Size",p.size_ml&&p.size_ml+" ml"],["Top notes",(p.top_notes||[]).join(", ")],["Heart notes",(p.heart_notes||[]).join(", ")],["Base notes",(p.base_notes||[]).join(", ")],["Longevity",p.longevity],["Sillage",p.sillage],["Gender",p.gender]]
    :[["Movement",p.movement],["Case",p.case_material],["Strap",p.strap],["Water resistance",p.water_resistance]];
  track("view_item",{product_id:p.id,value:price(p)});
  app.innerHTML=`<section><div class="wrap two"><div><img id="main" src="${esc(imgs[0]||"")}" style="width:100%;aspect-ratio:1;object-fit:cover"><div class="thumbs">${imgs.map(i=>`<img src="${esc(i)}" onclick="main.src=this.src">`).join("")}</div></div>
  <div><div class="mut">${esc(p.brand)} · ${esc(p.collection)}</div><h1>${esc(p.name)}</h1><div style="font-size:24px"><span class="price">${rs(price(p))}</span>${p.sale_price&&Number(p.sale_price)<Number(p.price)?`<span class="old">${rs(p.price)}</span>`:""}</div>
  <p class="mut">★ ${Number(p.rating).toFixed(1)} (${p.reviews} reviews) · ${p.stock>0?"In stock":"<span class=err>Out of stock</span>"}</p>
  ${colors.length?`<label>Color<select id="col">${colors.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>`:""}
  <label>Quantity<input id="qty" type="number" min="1" max="20" value="1"></label>
  <button class="btn" ${p.stock>0?"":"disabled"} id="add">Add to cart</button> <button class="btn o" ${p.stock>0?"":"disabled"} id="buy">Buy now</button>
  <p style="white-space:pre-line">${esc(p.description)}</p>
  ${spec.filter(x=>x[1]).map(x=>`<div class="row"><span class="mut">${x[0]}</span><span>${esc(x[1])}</span></div>`).join("")}
  <h3 style="margin-top:24px">Reviews</h3>${r.reviews.map(v=>`<p><b>${esc(v.customer_name)}</b> ${"★".repeat(v.rating)}<br>${esc(v.body||"")}</p>`).join("")||"<p class=mut>No reviews yet.</p>"}
  </div></div></section>`;
  const add=()=>{const qty=Math.max(1,Math.min(20,+$("#qty").value||1)),color=$("#col")?.value||null;
    const ex=cart.find(i=>i.slug==p.slug&&i.color==color);ex?ex.quantity+=qty:cart.push({product_id:p.id,slug:p.slug,name:p.name,image_url:p.image_url,price:price(p),quantity:qty,color});
    saveCart();track("add_to_cart",{product_id:p.id,value:price(p)*qty});lead("cart")};
  $("#add").onclick=()=>{add();toast("Added to cart")};$("#buy").onclick=()=>{add();location.hash="#/checkout"};
}
function totals(discount=0){const sub=cart.reduce((a,i)=>a+i.price*i.quantity,0),P=S.payment||{};
  const free=Number(P.free_delivery_above??5000),ship=sub-discount>=free?0:Number(P.delivery_charge??250),cod=Number(P.cod_charge||0);
  return{sub,ship:ship+cod,total:sub-discount+ship+cod}}
function cartPage(){
  if(!cart.length){app.innerHTML=`<section><div class="wrap"><h1>Your cart is empty</h1><a class="btn" href="#/shop">Shop now</a></div></section>`;return}
  const t=totals();
  app.innerHTML=`<section><div class="wrap"><h1>Cart</h1>${cart.map((i,k)=>`<div class="row" style="align-items:center"><span><img src="${esc(i.image_url)}" style="width:56px;height:56px;object-fit:cover;vertical-align:middle;margin-right:10px">${esc(i.name)} ${i.color?`(${esc(i.color)})`:""} × ${i.quantity}</span><span>${rs(i.price*i.quantity)} <button class="btn o" style="padding:4px 10px" onclick="cart.splice(${k},1);saveCart();cartPage()">✕</button></span></div>`).join("")}
  <div class="row"><b>Subtotal</b><b>${rs(t.sub)}</b></div><p><a class="btn" href="#/checkout">Checkout</a></p></div></section>`;
}
function lead(stage,f={}){fetch(API+"/track/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,stage,items:cart,cart_value:totals().sub,...f})}).catch(()=>{})}
function checkout(){
  if(!cart.length)return cartPage();
  let disc=0,code="";const key=crypto.randomUUID();track("begin_checkout",{value:totals().sub});
  const draw=()=>{const t=totals(disc);$("#sum").innerHTML=`${cart.map(i=>`<div class="row"><span>${esc(i.name)} × ${i.quantity}</span><span>${rs(i.price*i.quantity)}</span></div>`).join("")}
    <div class="row"><span>Subtotal</span><span>${rs(t.sub)}</span></div>${disc?`<div class="row"><span>Discount (${esc(code)})</span><span>-${rs(disc)}</span></div>`:""}<div class="row"><span>Delivery</span><span>${t.ship?rs(t.ship):"Free"}</span></div><div class="row"><b>Total</b><b class="price">${rs(t.total)}</b></div>`};
  app.innerHTML=`<section><div class="wrap two"><form id="f"><h1>Checkout</h1>
  <input name="customer_name" placeholder="Full name" required><input name="customer_email" type="email" placeholder="Email (order updates are sent here)" required>
  <input name="customer_phone" placeholder="Phone 03xx xxxxxxx" required><input name="city" placeholder="City" required><textarea name="shipping_address" placeholder="Full address" required></textarea>
  <select name="payment_method"><option value="cod">Cash on delivery</option><option value="bank">Bank transfer</option></select><textarea name="notes" placeholder="Notes (optional)"></textarea>
  <p class="err" id="e"></p><button class="btn" id="go">Place order</button></form>
  <div><h2>Order summary</h2><div id="sum"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="cp" placeholder="Coupon code" style="margin:0"><button class="btn o" id="ap" type="button">Apply</button></div><p id="cm" class="mut"></p></div></div></section>`;
  draw();
  $("#ap").onclick=async()=>{const r=await post("/coupons/validate",{code:$("#cp").value,subtotal:totals().sub}).catch(e=>({error:e.message}));
    if(r.ok){disc=r.discount;code=r.code;$("#cm").textContent="Coupon applied"}else{disc=0;code="";$("#cm").textContent=r.error};draw()};
  const f=$("#f");f.customer_phone.onblur=()=>lead("checkout",{name:f.customer_name.value,email:f.customer_email.value,phone:f.customer_phone.value});
  f.onsubmit=async e=>{e.preventDefault();$("#go").disabled=true;$("#e").textContent="";
    const b=Object.fromEntries(new FormData(f));
    try{const r=await post("/orders",{...b,coupon_code:code||null,items:cart.map(({product_id,slug,quantity,color})=>({product_id,slug,quantity,color})),idempotency_key:key,session_id:sid});
      cart=[];saveCart();localStorage.lastOrder=JSON.stringify(r.order);location.hash="#/thanks"}
    catch(err){$("#e").textContent=err.message;$("#go").disabled=false}};
}
function thanks(){const o=JSON.parse(localStorage.lastOrder||"null");if(!o)return home();
  app.innerHTML=`<section><div class="wrap" style="text-align:center"><h1>Thank you, ${esc(o.customer_name)}!</h1><p>Your order <b class="acc">${esc(o.order_number)}</b> has been placed. A confirmation email is on its way to ${esc(o.customer_email)}.</p><p>Total: <b>${rs(o.total)}</b></p><a class="btn" href="#/track?n=${esc(o.order_number)}">Track order</a> <a class="btn o" href="#/shop">Continue shopping</a></div></section>`}
function trackPage(q){
  app.innerHTML=`<section><div class="wrap" style="max-width:520px"><h1>Track your order</h1><form id="t"><input name="n" placeholder="Order number e.g. TM2610…" value="${esc(q.get("n")||"")}" required><input name="e" placeholder="Email or phone used at checkout" required><button class="btn">Track</button></form><div id="r"></div></div></section>`;
  $("#t").onsubmit=async e=>{e.preventDefault();const n=e.target.n.value.trim(),v=e.target.e.value.trim();
    try{const {order:o}=await get(`/orders/${encodeURIComponent(n)}?`+new URLSearchParams(v.includes("@")?{email:v}:{phone:v}));
      $("#r").innerHTML=`<h2>Status: <span class="acc">${esc(o.status)}</span></h2>${o.tracking_number?`<p>Courier: ${esc(o.courier||"")} · Tracking: ${esc(o.tracking_number)}</p>`:""}${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.name)} × ${i.quantity}</span><span>${rs(i.price*i.quantity)}</span></div>`).join("")}<div class="row"><b>Total</b><b>${rs(o.total)}</b></div>${(o.status_history||[]).map(h=>`<p class="mut">${esc(h.status)} — ${new Date(h.at).toLocaleString()}</p>`).join("")}`}
    catch{$("#r").innerHTML="<p class=err>Order not found. Check the number and email/phone.</p>"}};
}
async function account(){
  if(localStorage.tok){try{const r=await get("/auth/profile");
    app.innerHTML=`<section><div class="wrap"><h1>My account</h1><p>${esc(r.profile?.email||"")}</p><button class="btn o" onclick="localStorage.removeItem('tok');account()">Sign out</button><h2>My orders</h2>${r.orders.map(o=>`<div class="row"><a href="#/track?n=${esc(o.order_number)}">${esc(o.order_number)}</a><span>${esc(o.status)} · ${rs(o.total)}</span></div>`).join("")||"<p class=mut>No orders yet.</p>"}</div></section>`;return}catch{localStorage.removeItem("tok")}}
  app.innerHTML=`<section><div class="wrap" style="max-width:420px"><h1>Sign in</h1><form id="l"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><p class="err" id="e"></p><button class="btn" name="m" value="login">Sign in</button> <button class="btn o" name="m" value="signup">Create account</button></form></div></section>`;
  $("#l").onsubmit=async e=>{e.preventDefault();const m=e.submitter.value;try{const r=await post("/auth/"+m,{email:e.target.email.value,password:e.target.password.value});localStorage.tok=r.token;account()}catch(err){$("#e").textContent=err.message}};
}
async function route(){
  const [path,qs]=(location.hash.slice(1)||"/").split("?"),q=new URLSearchParams(qs);scrollTo(0,0);app.innerHTML="<section><div class='wrap mut'>Loading…</div></section>";
  try{if(path=="/")await home();else if(path=="/shop")await shop(q);else if(path.startsWith("/p/"))await product(decodeURIComponent(path.slice(3)));
    else if(path=="/cart")cartPage();else if(path=="/checkout")checkout();else if(path=="/thanks")thanks();else if(path=="/track")trackPage(q);else if(path=="/account")await account();else await home();
    track("page_view")}catch(e){app.innerHTML=`<section><div class="wrap err">Could not load: ${esc(e.message)}</div></section>`}
}
(async()=>{saveCart();try{S=await get("/settings")}catch{}const st=S.settings||{};
  if(st.announcement||st.announcement_text)$("#bar").textContent=st.announcement||st.announcement_text;
  const wa=(st.whatsapp_number||st.whatsapp||"").replace(/\D/g,"");if(wa){$("#wa").href="https://wa.me/"+wa;$("#wa").style.display="grid"}
  $("#foot").textContent=[st.contact_email,st.contact_phone].filter(Boolean).join(" · ");
  addEventListener("hashchange",route);route()})();
</script>
</body>
</html>
